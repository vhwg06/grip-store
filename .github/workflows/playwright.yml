name: Playwright Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

# Gherkin is the acceptance source, Cucumber owns Scenario lifecycle, and the
# step adapters use Playwright for both APIRequestContext and browser execution.
# Keep the endpoint and credential names explicit so CI cannot silently fall
# back to localhost or a fake account.
env:
  TEST_API_BASE_URL: https://grip.vn/api
  TEST_WEB_BASE_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
  # These are the official migration seed accounts documented in
  # docs/runbook-deploy-fe.md; repository secrets can override them.
  TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL || 'test_buyer@example.com' }}
  TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD || 'Password123!' }}
  ADMIN_USER_EMAIL: ${{ secrets.ADMIN_USER_EMAIL || 'test_admin@example.com' }}
  ADMIN_USER_PASSWORD: ${{ secrets.ADMIN_USER_PASSWORD || 'Password123!' }}
  TEST_USER_TOKEN: ${{ secrets.TEST_USER_TOKEN }}
  ADMIN_USER_TOKEN: ${{ secrets.ADMIN_USER_TOKEN }}
  TEST_TENANT_ID: ${{ secrets.TEST_TENANT_ID }}
  TEST_RUN_ID: ci-${{ github.run_id }}

jobs:
  contract:
    name: Cucumber contract and binding checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: test/package-lock.json

      - name: Install test dependencies
        run: npm ci --prefix test

      - name: Validate modules and OpenAPI contract
        run: npm --prefix test run validate

      - name: Rebuild traceability and migration audit
        run: |
          npm --prefix test run build:traceability
          npm --prefix test run build:migration-audit

      - name: Dry-run all accepted Gherkin scenarios
        working-directory: test
        run: ./node_modules/.bin/cucumber-js --config cucumber.config.cjs --dry-run --tags "@accepted"

  test:
    name: Playwright via Cucumber (${{ matrix.layer }}, non-Catalog)
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        layer: [api, browser]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: test/package-lock.json

      - name: Install test dependencies
        run: npm ci --prefix test

      - name: Verify runtime configuration
        shell: bash
        run: |
          test -n "$TEST_API_BASE_URL"
          test -n "$TEST_USER_EMAIL"
          test -n "$TEST_USER_PASSWORD"
          test -n "$ADMIN_USER_EMAIL"
          test -n "$ADMIN_USER_PASSWORD"
          test -n "$TEST_TENANT_ID"
          if [ "${{ matrix.layer }}" = "browser" ]; then
            test -n "$TEST_WEB_BASE_URL"
          fi

      - name: Install Playwright Chromium
        if: matrix.layer == 'browser'
        working-directory: test
        run: npx playwright install --with-deps chromium

      - name: Run non-Catalog Gherkin scenarios on Playwright
        working-directory: test
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          npm run "test:${{ matrix.layer }}:non-catalog" 2>&1 | tee "artifacts/${{ matrix.layer }}.log"

      - name: Upload Cucumber log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-${{ matrix.layer }}-non-catalog
          path: test/artifacts/
          if-no-files-found: ignore
          retention-days: 14

  catalog-expected-failure:
    name: Catalog (expected failure until backend implementation)
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: test/package-lock.json

      - name: Install test dependencies
        run: npm ci --prefix test

      - name: Verify runtime configuration
        shell: bash
        run: |
          test -n "$TEST_API_BASE_URL"
          test -n "$TEST_USER_EMAIL"
          test -n "$TEST_USER_PASSWORD"
          test -n "$ADMIN_USER_EMAIL"
          test -n "$ADMIN_USER_PASSWORD"

      - name: Run Catalog Gherkin scenarios (expected failure)
        id: catalog
        continue-on-error: true
        working-directory: test
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          npm run test:catalog 2>&1 | tee artifacts/catalog.log

      - name: Explain expected Catalog result
        if: always()
        run: |
          {
            echo "## Catalog test status"
            echo
            echo "Catalog scenarios are executed against ${TEST_API_BASE_URL}."
            echo "The backend Catalog Base is not implemented yet, so this job is intentionally non-blocking."
            echo "All non-Catalog API and browser jobs remain blocking."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Catalog log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-catalog-expected-failure
          path: test/artifacts/
          if-no-files-found: ignore
          retention-days: 14
