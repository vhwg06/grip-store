name: Playwright Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      run_e2e:
        description: Run browser-tagged Cucumber scenarios
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# Gherkin is the acceptance source, Cucumber owns Scenario lifecycle, and the
# step adapters use Playwright for both APIRequestContext and browser execution.
# Keep the endpoint and credential names explicit so CI cannot silently fall
# back to localhost or a fake account.
env:
  TEST_API_BASE_URL: https://grip.vn/api
  TEST_WEB_BASE_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || 'https://grip.vn' }}
  # These are the official migration seed accounts documented in
  # docs/runbook-deploy-fe.md; repository secrets can override them.
  TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL || 'test_buyer@example.com' }}
  TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD || 'Password123!' }}
  ADMIN_USER_EMAIL: ${{ secrets.ADMIN_USER_EMAIL || 'test_admin@example.com' }}
  ADMIN_USER_PASSWORD: ${{ secrets.ADMIN_USER_PASSWORD || 'Password123!' }}
  TEST_USER_TOKEN: ${{ secrets.TEST_USER_TOKEN }}
  ADMIN_USER_TOKEN: ${{ secrets.ADMIN_USER_TOKEN }}
  TEST_RUN_ID: ci-${{ github.run_id }}

jobs:
  figma-harness:
    name: Figma harness (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: test/package-lock.json

      - name: Install test dependencies
        run: npm ci --prefix test

      - name: Run Figma harness regression tests
        run: npm --prefix test run test:figma-harness

  contract:
    name: Cucumber contract and binding checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: test/package-lock.json

      - name: Install test dependencies
        run: npm ci --prefix test

      - name: Run Figma harness lifecycle regression tests
        run: npm --prefix test run test:figma-harness

      - name: Validate modules and OpenAPI contract
        run: npm --prefix test run validate

      - name: Rebuild traceability and migration audit
        run: |
          npm --prefix test run build:traceability
          npm --prefix test run build:migration-audit

      - name: Dry-run all accepted Gherkin scenarios
        working-directory: test
        run: ./node_modules/.bin/cucumber-js --config cucumber.config.cjs --dry-run --tags "@accepted"

  api-tests:
    name: API tests via Playwright (@accepted and @api)
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: test/package-lock.json

      - name: Install test dependencies
        run: npm ci --prefix test

      - name: Verify runtime configuration
        shell: bash
        run: |
          test -n "$TEST_API_BASE_URL"
          test -n "$TEST_USER_EMAIL"
          test -n "$TEST_USER_PASSWORD"
          test -n "$ADMIN_USER_EMAIL"
          test -n "$ADMIN_USER_PASSWORD"

      - name: Run API-tagged Gherkin scenarios on Playwright
        working-directory: test
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          npm run test:api -- --parallel 1 2>&1 | tee artifacts/api.log

      - name: Upload Cucumber log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-api
          path: test/artifacts/
          if-no-files-found: ignore
          retention-days: 14

  e2e-tests:
    name: E2E tests via Playwright (@accepted and @browser)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_e2e == true }}
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: test/package-lock.json

      - name: Install test dependencies
        run: npm ci --prefix test

      - name: Verify runtime configuration
        shell: bash
        run: |
          test -n "$TEST_API_BASE_URL"
          test -n "$TEST_USER_EMAIL"
          test -n "$TEST_USER_PASSWORD"
          test -n "$ADMIN_USER_EMAIL"
          test -n "$ADMIN_USER_PASSWORD"
          test -n "$TEST_WEB_BASE_URL"

      - name: Install Playwright Chromium
        working-directory: test
        run: npx playwright install --with-deps chromium

      - name: Run browser-tagged Gherkin scenarios on Playwright
        working-directory: test
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          npm run test:browser -- --parallel 1 2>&1 | tee artifacts/e2e.log

      - name: Upload E2E log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-e2e
          path: test/artifacts/
          if-no-files-found: ignore
          retention-days: 14
